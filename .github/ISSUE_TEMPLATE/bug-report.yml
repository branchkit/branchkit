name: Bug report
description: BranchKit, or one of its built-in plugins, did something wrong.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Everything here is public. Don't paste anything private, and don't attach a report file: if we need one, we'll ask for it privately.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you were doing, and what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps, or what you said, if it happens again.
    validations:
      required: false

  - type: input
    id: about
    attributes:
      label: Which part of BranchKit?
      description: The plugin involved, or "BranchKit" if you're not sure.
      placeholder: "BranchKit"
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: BranchKit version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      placeholder: "macOS 15.4, Windows 11 24H2, Ubuntu 24.04 (Wayland)"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: What BranchKit recorded
      description: Filled in by Help → Report a problem in BranchKit. Otherwise optional; leave out anything you said or typed.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: reviewed
    attributes:
      label: Before you submit
      options:
        - label: I've read this issue and it contains nothing I want to keep private.
          required: true
